name: ${{values.app_name}}-cicd-pipeline
on: 
    push: 
        branches: 
          - master 
        paths: 
          - src/** 
    workflow_dispatch: 
permissions: 
    contents: write 
jobs: 
    setting-runner: 
      runs-on: ubuntu-latest 
      steps: 
        - uses: actions/checkout@v4 
        - name: setup kubectl  
          uses: azure/setup-kubectl@v3

        - name: apply runner 
          run: kubectl apply -f runner-deployment.yml
          env:
            KUBECONFIG_DATA: ${{ "{{" }} secrets.KUBECONFIG {{ "}}" }}
        
        - name: Runner names 
          run: kubectl get runners -n actions-runner-system 
        
        

    CI: 
        outputs: 
          commit_id : ${{'${{ steps.calc_sha.outputs.short_sha }}'}}
        runs-on: self-hosted
        steps: 
            - uses: actions/checkout@v4
              with: 
                token: ${{'${{ secrets.GT_TOKEN }}'}}

            - name: Calculate short SHA
              shell: bash 
              run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
              id: calc_sha
            
            
            - name: Login to Dockerhub 
              uses: docker/login-action@v4
              with: 
                username: ${{ '${{ secrets.DOCKERHUB_USERNAME }}' }}
                password: ${{ '${{ secrets.DOCKERHUB_TOKEN }}' }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                driver: docker


            - name: Build and push
              uses: docker/build-push-action@v6
              with: 
                push: true 
                tags: ${{'${{ secrets.DOCKERHUB_USERNAME }}'}}/${{values.app_name}}:${{'${{ steps.calc_sha.outputs.short_sha }}'}}
            

            - name: Update image tag in values.yaml of helm 
              run: |
                sed -i "s|^\(\s*tag:\s*\).*|\1\"${{'${{ steps.calc_sha.outputs.short_sha }}'}}\"|" charts/${{values.app_name}}/values-${{values.app_env}}.yaml
                git config user.name "github-actions"
                git config user.email "github-actions@github.com"
                git add charts/python-app/values.yaml
                git commit -m "ci: update image tag to ${{'${{ steps.calc_sha.outputs.short_sha }}'}}"
                git push


    CD: 
      needs: CI 
      runs-on: self-hosted 
      env : 
          commit_id: ${{'${{needs.CI.outputs.commit_id}}'}}
      steps : 
           
          - name: Install Argo CD CLI
            run: |
              ARGOCD_VERSION=v2.13.2
              mkdir -p "$HOME/bin"
              curl -fsSL -o "$HOME/bin/argocd" \
                "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
              chmod +x "$HOME/bin/argocd"
              echo "$HOME/bin" >> "$GITHUB_PATH"
              "$HOME/bin/argocd" version --client
          - name: Argo CD sync
            shell: bash
            env:
              ARGOCD_PASSWORD: ${{'${{ secrets.ARGOCD_PASSWORD }}'}}
            run: |
              argocd login argocd-server.argocd \
                --plaintext --grpc-web \
                --username admin \
                --password "$ARGOCD_PASSWORD"

              argocd app sync ${{values.app_name}}
              argocd app wait ${{values.app_name}} --health --timeout 300